<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демонический Сигил</title>
    <style>
        :root {
            --demon-dark: #220000;
            --demon-blood: #8b0000;
            --demon-fire: #ff3800;
            --demon-shadow: #0a0000;
            --demon-purple: #4a154e;
            --demon-glow: #ff0066;
            --demon-crimson: #dc143c;
            --demon-ember: #cc4125;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        svg {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        svg .line {
            transform-origin: center;
            fill: none;
            stroke: var(--demon-blood);
            stroke-width: 3px;
            filter: drop-shadow(0 0 8px var(--demon-fire));
            transition: all 0.3s ease;
        }

        svg .line:hover {
            stroke: var(--demon-fire);
            filter: drop-shadow(0 0 15px var(--demon-glow));
        }

        svg .text {
            transform-origin: center;
            font-size: 36px;
            fill: var(--demon-crimson);
            stroke: none;
            filter: drop-shadow(0 0 10px var(--demon-fire));
            text-shadow: 0 0 15px var(--demon-glow);
        }

        /* Дополнительные эффекты свечения */
        .outer-circle .line:nth-child(1) {
            stroke: var(--demon-fire);
            stroke-width: 4px;
        }

        .outer-circle .line:nth-child(2) {
            stroke: var(--demon-blood);
            animation: demonPulse 3s ease-in-out infinite alternate;
        }

        .inner-circle .line:nth-child(1) {
            stroke: var(--demon-ember);
            stroke-width: 3px;
        }

        .inner-circle .line:nth-child(2) {
            stroke: var(--demon-crimson);
            animation: demonPulse 2.5s ease-in-out infinite alternate;
        }

        .outer-star .line {
            stroke: var(--demon-glow);
            filter: drop-shadow(0 0 12px var(--demon-fire));
            animation: starFlicker 4s ease-in-out infinite;
        }

        .inner-star .line {
            stroke: var(--demon-fire);
            filter: drop-shadow(0 0 15px var(--demon-glow));
            animation: starFlicker 3s ease-in-out infinite;
        }

        @keyframes demonPulse {
            0% {
                stroke-width: 2px;
                opacity: 0.7;
                filter: drop-shadow(0 0 5px var(--demon-fire));
            }

            100% {
                stroke-width: 5px;
                opacity: 1;
                filter: drop-shadow(0 0 20px var(--demon-glow));
            }
        }

        @keyframes starFlicker {

            0%,
            100% {
                opacity: 0.8;
                filter: drop-shadow(0 0 8px var(--demon-fire));
            }

            25% {
                opacity: 1;
                filter: drop-shadow(0 0 18px var(--demon-glow));
            }

            50% {
                opacity: 0.6;
                filter: drop-shadow(0 0 5px var(--demon-blood));
            }

            75% {
                opacity: 1.2;
                filter: drop-shadow(0 0 25px var(--demon-fire));
            }
        }

        /* Эффект мерцания для текста */
        .text {
            animation: textGlow 5s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% {
                fill: var(--demon-blood);
                filter: drop-shadow(0 0 8px var(--demon-fire));
            }

            50% {
                fill: var(--demon-fire);
                filter: drop-shadow(0 0 20px var(--demon-glow));
            }

            100% {
                fill: var(--demon-crimson);
                filter: drop-shadow(0 0 15px var(--demon-ember));
            }
        }
    </style>
</head>

<body>
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <defs>
            <path id="square" d="M 500 100 L 900 500 L 500 900 L 100 500 Z" />
            <path id="square-sm" d="M 500 270 L 730 500 L 500 730 L 270 500 Z" />
            <path id="runes-outer" d="
          M 500 87.5
          A 412.5 412.5 0 0 1 912.5 500
          A 412.5 412.5 0 0 1 500 912.5
          A 412.5 412.5 0 0 1 87.5 500
          A 412.5 412.5 0 0 1 500 87.5
          Z
        " />
            <path id="runes-inner" d="
          M 500 255
          A 245 245 0 0 1 745 500
          A 245 245 0 0 1 500 745
          A 245 245 0 0 1 255 500
          A 245 245 0 0 1 500 255
          Z
        " />
            <linearGradient id="demonShine" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8b0000">
                    <animate attributeName="stop-color" values="#8b0000; #ff3800; #ff0066; #8b0000" dur="15s"
                        repeatCount="indefinite" />
                </stop>
                <stop offset="100%" stop-color="#ff3800">
                    <animate attributeName="stop-color" values="#ff3800; #ff0066; #8b0000; #ff3800" dur="15s"
                        repeatCount="indefinite" />
                </stop>
            </linearGradient>

            <filter id="demonGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5" result="fireBlur" />
                <feColorMatrix in="fireBlur" type="matrix" values="1 0 0 0 0.8  0 0.3 0 0 0  0 0 0.2 0 0  0 0 0 1 0" />
                <feMerge>
                    <feMergeNode in="fireBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
        <g>
            <g class="outer-circle">
                <circle class="line" cx="500" cy="500" r="450" filter="url(#demonGlow)" />
                <circle class="line" cx="500" cy="500" r="400" filter="url(#fireGlow)" />
                <text class="text" id="runes-outer-text" filter="url(#demonGlow)">
                    <textPath id="runes-outer-path" href="#runes-outer" textLength="100%">
                        ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛈᛇᛉᛊᛋᛏᛒᛖᛗᛚᛜᛞᛟ
                    </textPath>
                </text>
            </g>
            <g class="outer-star">
                <path class="line" d="M 500 100 L 900 500 L 500 900 L 100 500 Z" filter="url(#fireGlow)" />
                <path class="line" d="M 500 100 L 900 500 L 500 900 L 100 500 Z" style="transform: rotate(30deg);"
                    filter="url(#demonGlow)" />
                <path class="line" d="M 500 100 L 900 500 L 500 900 L 100 500 Z" style="transform: rotate(60deg);"
                    filter="url(#fireGlow)" />
            </g>

            <g class="inner-circle">
                <circle class="line" cx="500" cy="500" r="280" filter="url(#demonGlow)" />
                <circle class="line" cx="500" cy="500" r="230" filter="url(#fireGlow)" />
                <text class="text" id="runes-inner-text" filter="url(#demonGlow)">
                    <textPath id="runes-inner-path" href="#runes-inner" textLength="100%">
                        ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛈᛇᛉᛊᛋᛏᛒᛖᛗᛚᛜᛞᛟ
                    </textPath>
                </text>
            </g>

            <g class="inner-star">
                <path class="line" d="M 500 270 L 730 500 L 500 730 L 270 500 Z" filter="url(#fireGlow)" />
                <path class="line" d="M 500 270 L 730 500 L 500 730 L 270 500 Z" style="transform: rotate(45deg)"
                    filter="url(#demonGlow)" />
            </g>
        </g>
    </svg>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script>
        // Демонические цвета для случайного изменения
        const demonColors = ['#8b0000', '#ff3800', '#ff0066', '#dc143c', '#cc4125'];

        function randomDemonColor() {
            return demonColors[Math.floor(Math.random() * demonColors.length)];
        }

        function getCircleLength(r) {
            return 2 * Math.PI * r;
        }

        function updatePathTextLength(id, r) {
            const length = getCircleLength(r);
            const path = document.querySelector(id);
            path.setAttribute('textLength', length + 'px');
        }

        function getTotalLength(element) {
            if (element.tagName === 'circle') {
                const r = parseFloat(element.getAttribute('r'));
                return 2 * Math.PI * r;
            } else if (element.tagName === 'path') {
                return element.getTotalLength();
            }
            return 0;
        }

        window.addEventListener('load', function () {
            updatePathTextLength('#runes-outer-path', 412.5);
            updatePathTextLength('#runes-inner-path', 245);

            const duration = 1;

            // Получаем все элементы
            const outerCircleLines = document.querySelectorAll('.outer-circle .line');
            const outerCircleText = document.querySelector('.outer-circle .text');
            const outerStarLines = document.querySelectorAll('.outer-star .line');
            const innerCircleLines = document.querySelectorAll('.inner-circle .line');
            const innerCircleText = document.querySelector('.inner-circle .text');
            const innerStarLines = document.querySelectorAll('.inner-star .line');
            const allLines = document.querySelectorAll('.line');

            // Инициализируем stroke-dasharray для всех линий
            allLines.forEach(line => {
                const length = getTotalLength(line);
                line.style.strokeDasharray = length;
                line.style.strokeDashoffset = length;
            });

            const timeline = gsap.timeline();

            // Скрываем текст
            timeline.set('.text', { opacity: 0 });

            // Outer circle lines - рисуются последовательно
            timeline.to(outerCircleLines[0], {
                strokeDashoffset: 0,
                duration: duration / 2,
                ease: 'none'
            });
            timeline.to(outerCircleLines[1], {
                strokeDashoffset: 0,
                duration: duration / 2,
                ease: 'none'
            });

            // Outer circle text появляется
            timeline.to(outerCircleText, {
                opacity: 1,
                duration: duration
            });

            // Outer star lines - рисуются с задержкой между собой
            timeline.to(outerStarLines[0], {
                strokeDashoffset: 0,
                duration: duration,
                ease: 'none'
            });
            timeline.to(outerStarLines[1], {
                strokeDashoffset: 0,
                duration: duration,
                ease: 'none'
            }, `-=${duration * 0.75}`);
            timeline.to(outerStarLines[2], {
                strokeDashoffset: 0,
                duration: duration,
                ease: 'none'
            }, `-=${duration * 0.75}`);

            // Inner circle lines - рисуются последовательно
            timeline.to(innerCircleLines[0], {
                strokeDashoffset: 0,
                duration: duration / 2,
                ease: 'none'
            });
            timeline.to(innerCircleLines[1], {
                strokeDashoffset: 0,
                duration: duration / 2,
                ease: 'none'
            });

            // Inner circle text появляется
            timeline.to(innerCircleText, {
                opacity: 1,
                duration: duration
            });

            // Inner star lines - рисуются с задержкой между собой
            timeline.to(innerStarLines[0], {
                strokeDashoffset: 0,
                duration: duration,
                ease: 'none'
            });
            timeline.to(innerStarLines[1], {
                strokeDashoffset: 0,
                duration: duration,
                ease: 'none'
            }, `-=${duration * 0.75}`);

            // Вращение рун
            timeline.to('#runes-outer-text', {
                rotation: 360,
                duration: duration * 16,
                ease: 'none',
                repeat: -1,
                transformOrigin: 'center'
            });
            timeline.to('#runes-inner-text', {
                rotation: -360,
                duration: duration * 16,
                ease: 'none',
                repeat: -1,
                transformOrigin: 'center'
            }, '<');

            // Случайное изменение цветов для демонического эффекта
            setInterval(() => {
                const lines = document.querySelectorAll('.line');
                lines.forEach((line, index) => {
                    if (Math.random() < 0.2) {
                        gsap.to(line, {
                            duration: 1,
                            stroke: randomDemonColor(),
                            ease: "power2.inOut"
                        });
                    }
                });
            }, 3000);

            // Эффект мерцания при клике
            document.addEventListener('click', () => {
                gsap.to('.line', {
                    duration: 0.2,
                    filter: 'drop-shadow(0px 0px 25px #ff0066)',
                    yoyo: true,
                    repeat: 1,
                    ease: "power2.inOut"
                });
            });
        });
    </script>
</body>

</html>
